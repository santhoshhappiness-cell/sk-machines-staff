workflows:
  android-build:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      android_sdk: 33
      vars:
        JAVA_VERSION: 11
    triggering:
      events:
        - push
        - pull_request
      branch:
        include:
          - claude/daily-activity-tracker-app-01ylpt
          - main
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true
